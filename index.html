<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f7f4ef; --surface:#fffdfa; --ink:#262420; --muted:#8a8378; --line:#e6e0d6;
  --accent:#262420; --accent-ink:#fffdfa; --accent-soft:#eee9e1; --danger:#a8432f;
  --shadow:0 1px 2px rgba(40,30,10,.04),0 6px 18px rgba(40,30,10,.05);
  --font:"Raleway",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--font);font-weight:500;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:var(--font)}
button{color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 96px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:8px 15px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;padding-left:4px;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}
.icon-btn{width:40px;height:40px;justify-content:center;padding:0;flex:none}

/* discreet options */
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;font-size:13px;color:var(--muted)}
.opt-group{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.opt-label{margin-right:4px}
.opt{border:0;background:none;color:var(--muted);font-size:13px;font-weight:500;padding:2px 5px;cursor:pointer}
.opt:hover{color:var(--ink)}
.opt.on{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.scale-in{width:46px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);
  padding:1px 2px;font-size:13px;text-align:center;outline:none;margin-left:4px}
.scale-in:focus{border-bottom-color:var(--ink)}

/* top bar */
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bar-in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.spacer{flex:1}

/* home */
.home-top{display:flex;gap:10px;align-items:center;margin:16px 0 22px}
.search{position:relative;flex:1}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;padding:13px 16px 13px 46px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:15px;font-weight:500;outline:none}
.search input:focus{border-color:var(--muted)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .15s,border-color .15s;text-align:left;width:100%}
.card:hover{transform:translateY(-2px);border-color:var(--muted)}
.card h3{font-weight:700;font-size:1.2rem;line-height:1.2;margin:0 0 6px}
.card .meta{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.card .peek{margin:8px 0 0;font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:var(--muted);padding:48px 16px;border:1px dashed var(--line);border-radius:14px}

/* recipe page */
.title{font-weight:700;font-size:clamp(2rem,6vw,2.9rem);line-height:1.1;margin:22px 0 16px;letter-spacing:-.005em;overflow-wrap:anywhere;text-align:center}
.title.left{text-align:left;font-size:clamp(1.7rem,5vw,2.2rem)}
.recipe-opts{justify-content:center;margin:-12px 0 26px}
.rule{border:0;border-top:1px solid var(--line);margin:26px 0}
.rule.strong{border-top:1.5px solid var(--ink);margin-top:0}
.section{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);font-weight:700;margin:0 0 12px}
.scaled-note{display:flex;justify-content:center;gap:6px;font-size:13px;color:var(--muted);margin:-8px 0 18px}
.scaled-note button{border:0;background:transparent;color:var(--ink);cursor:pointer;font-size:13px;text-decoration:underline;padding:0}
.ings{list-style:none;margin:0;padding:0}
.ing{display:grid;grid-template-columns:7.5rem 1fr auto;gap:4px 14px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.qty{font-weight:700;font-variant-numeric:lining-nums tabular-nums}
.qty .u{font-weight:500;color:var(--muted);margin-left:3px}
.qty.fallback{opacity:.55;font-weight:600}
.amt{border:0;background:none;padding:0 1px;font-weight:700;font-size:inherit;cursor:pointer;color:var(--ink);
  border-bottom:1px dotted var(--muted);font-variant-numeric:lining-nums tabular-nums}
.amt-input{width:4.5rem;border:1px solid var(--ink);border-radius:6px;padding:1px 6px;font-size:inherit;font-weight:700;background:var(--surface);color:var(--ink)}
.iname{overflow-wrap:anywhere}
.alt{color:var(--muted);font-size:14px;text-align:right;font-variant-numeric:lining-nums tabular-nums}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:2rem 1fr;gap:10px;padding:8px 0;cursor:pointer;align-items:baseline}
.steps li::before{content:counter(s) ".";font-weight:700;color:var(--muted);font-variant-numeric:lining-nums}
.steps li.done{color:var(--muted);text-decoration:line-through}
.steps li.done::before{content:"✓"}
.none{color:var(--muted);font-style:italic}
.note-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.note-status{font-size:12px;color:var(--muted);font-weight:500}
.note{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);
  padding:12px 14px;font-size:15px;font-weight:500;line-height:1.6;resize:vertical;outline:none;field-sizing:content}
.note:focus{border-color:var(--muted)}
@media (max-width:560px){
  .ing{grid-template-columns:5.6rem 1fr}
  .alt{grid-column:2;text-align:left;font-size:13px}
}

/* editor */
.field{display:block;margin:0 0 26px}
.field>span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);font-weight:700;margin-bottom:6px}
.in{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 11px;font-size:15px;font-weight:500;outline:none}
.in:focus{border-color:var(--muted)}
.in.big{font-size:1.4rem;font-weight:700;padding:10px 14px}
textarea.in{resize:vertical;min-height:44px;field-sizing:content}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 14px}
.ehead,.erow{display:grid;gap:8px;align-items:center}
.erow{grid-template-columns:var(--cols);margin-bottom:8px}
.ehead{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.num{color:var(--muted);font-size:13px;text-align:center;font-variant-numeric:lining-nums tabular-nums}
.units{display:contents}
.uf>span{display:none}
.rowact{display:flex;gap:2px;justify-content:flex-end}
.mini{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:14px}
.mini:hover{border-color:var(--line);color:var(--ink)}
.mini.x:hover{color:var(--danger)}
.srow{display:grid;grid-template-columns:28px 1fr 96px;gap:8px;align-items:start;margin-bottom:8px}
.srow .num{padding-top:11px}
.add-row{margin-top:6px}
@media (max-width:680px){
  .ehead{display:none}
  .erow{grid-template-columns:24px 1fr auto;grid-template-areas:"n name act" ". units units";
    background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
  .erow>.num{grid-area:n}
  .erow>.in{grid-area:name}
  .erow>.rowact{grid-area:act}
  .units{grid-area:units;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .uf>span{display:block;font-size:11px;color:var(--muted);margin:0 0 3px 2px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .srow{grid-template-columns:22px 1fr}
  .srow .rowact{grid-column:2}
}

/* misc */
.banner{background:var(--accent-soft);color:var(--ink);font-size:13px;text-align:center;padding:8px 16px}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);gap:14px;text-align:center}
.spin{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;transition:all .25s;z-index:50;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:60;padding:16px}
.modal-box{background:var(--surface);border-radius:16px;padding:22px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-box h3{margin:0 0 8px;font-size:1.25rem;font-weight:700}
.modal-box p{margin:0 0 18px;color:var(--muted);font-size:14px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
</style>
</head>
<body>
<div id="banner"></div>
<div id="app"><div class="loading"><div><div class="spin"></div>Loading your recipes…</div></div></div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================
   Backend bridge (Google Apps Script, or demo data when opened locally)
   ========================================================= */
// ⬇️ Paste your Apps Script Web app URL here (it ends in /exec).
const API_URL = 'https://script.google.com/macros/s/AKfycbzlth_WcGH-XcpdiLDoM_MaFMNFeSOemhDlZNj0lTigVz7tTOAGjPUgX9F7YgbuuXeqQA/exec';

const HAS_GAS = !!(window.google && google.script && google.script.run);
const DEMO = /[?&]demo\b/.test(location.search);
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const apiUrl = () => (API_URL || store.get('recipeApiUrl')).trim();

async function call(fn, ...args) {
  if (DEMO) return Demo[fn](...args.map(a => JSON.parse(JSON.stringify(a ?? null))));
  if (HAS_GAS) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
  }
  let res, data;
  try {
    res = await fetch(apiUrl(), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn, args })
    });
  } catch (e) {
    throw new Error('Couldn\'t reach Google Sheets. Check your internet, and that the Apps Script web app access is set to "Anyone".');
  }
  try { data = await res.json(); }
  catch (e) { throw new Error('Google sent back an unexpected reply. Check the web app URL and that access is set to "Anyone".'); }
  if (!data.ok) throw new Error(data.error);
  return data.result;
}

const Demo = (() => {
  let db = {
    units: ['Amount', 'grams', 'ml', 'cups'],
    recipes: [
      { name: 'Tiramisu', ingredients: [
        { name: 'egg yolk', values: { Amount: '2', grams: '10' } },
        { name: 'egg whites', values: { Amount: '2', grams: '40' } },
        { name: 'sugar', values: { grams: '50', cups: '3 tbsp' } },
        { name: 'mascarpone', values: { grams: '250' } },
        { name: 'ladyfingers', values: { grams: '200' } },
        { name: 'coffee pods', values: { Amount: '4', grams: '250' } } ],
        note: 'dip the ladyfingers very fast',
        steps: ['beat egg yolks and sugar until fluffy', 'beat egg whites and other half of sugar', 'fold them together', 'dip lady fingers in coffee and assemble'] },
      { name: 'Pasta', ingredients: [
        { name: 'tomato paste', values: { cups: '3 tbsp' } },
        { name: 'olive oil', values: { cups: '1 tbsp' } },
        { name: 'heavy cream', values: { ml: '125' } },
        { name: 'cheese', values: { cups: '1/2 cup' } } ],
        steps: ['Just make it'] }
    ]
  };
  const clone = o => JSON.parse(JSON.stringify(o));
  const later = (fn) => new Promise((res, rej) => setTimeout(() => { try { res(clone(fn())); } catch (e) { rej(e); } }, 300));
  const k = s => String(s || '').trim().toLowerCase();
  return {
    getData: () => later(() => db),
    saveRecipe: (r, orig) => later(() => {
      const oldKey = k(orig || r.name), newKey = k(r.name);
      if (!newKey) throw new Error('The recipe needs a name.');
      if (newKey !== oldKey && db.recipes.some(x => k(x.name) === newKey)) throw new Error(`A recipe called "${r.name}" already exists.`);
      const prev = db.recipes.find(x => k(x.name) === oldKey);
      const clean = { name: r.name.trim(), note: prev ? prev.note || '' : '', ingredients: r.ingredients.filter(i => i.name.trim()), steps: r.steps.map(s => s.trim()).filter(Boolean) };
      const i = db.recipes.findIndex(x => k(x.name) === oldKey);
      if (i >= 0) db.recipes[i] = clean; else db.recipes.push(clean);
      return db;
    }),
    saveNote: (name, text) => later(() => { const r = db.recipes.find(x => k(x.name) === k(name)); if (r) r.note = text; return true; }),
    deleteRecipe: (name) => later(() => { db.recipes = db.recipes.filter(x => k(x.name) !== k(name)); return db; })
  };
})();

/* =========================================================
   Units, parsing & formatting
   ========================================================= */
const UNITS = {
  g: { fam: 'mass', f: 1, label: 'g' }, kg: { fam: 'mass', f: 1000, label: 'kg' }, mg: { fam: 'mass', f: .001, label: 'mg' },
  oz: { fam: 'mass', f: 28.3495, label: 'oz' }, lb: { fam: 'mass', f: 453.592, label: 'lb' },
  ml: { fam: 'vol', f: 1, label: 'ml' }, cl: { fam: 'vol', f: 10, label: 'cl' }, dl: { fam: 'vol', f: 100, label: 'dl' },
  l: { fam: 'vol', f: 1000, label: 'l' }, tsp: { fam: 'vol', f: 4.92892, label: 'tsp' },
  tbsp: { fam: 'vol', f: 14.7868, label: 'tbsp' }, cup: { fam: 'vol', f: 236.588, label: 'cup' },
  floz: { fam: 'vol', f: 29.5735, label: 'fl oz' }
};
const ALIAS = {
  g: 'g', gr: 'g', gm: 'g', gram: 'g', gramme: 'g', kg: 'kg', kilo: 'kg', kilogram: 'kg', mg: 'mg', milligram: 'mg',
  oz: 'oz', ounce: 'oz', lb: 'lb', lbs: 'lb', pound: 'lb',
  ml: 'ml', milliliter: 'ml', millilitre: 'ml', cl: 'cl', dl: 'dl', l: 'l', liter: 'l', litre: 'l',
  tsp: 'tsp', teaspoon: 'tsp', tbsp: 'tbsp', tbs: 'tbsp', tbl: 'tbsp', tablespoon: 'tbsp',
  cup: 'cup', c: 'cup', 'fl oz': 'floz', floz: 'floz'
};
function normUnit(s) {
  s = String(s || '').toLowerCase().replace(/[.()]/g, '').replace(/\s+/g, ' ').trim();
  if (!s) return null;
  return ALIAS[s] || ALIAS[s.replace(/s$/, '')] || ALIAS[s.replace(/es$/, '')] || null;
}

const FRAC = { '½': 1/2, '⅓': 1/3, '⅔': 2/3, '¼': 1/4, '¾': 3/4, '⅛': 1/8, '⅜': 3/8, '⅝': 5/8, '⅞': 7/8 };
function parseNumber(s) {
  s = String(s ?? '').trim().replace(/(\d),(?=\d{3}\b)/g, '$1');
  let m;
  if ((m = s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)(.*)$/))) return [+m[1] + m[2] / m[3], m[4]];
  if ((m = s.match(/^(\d+)\s*\/\s*(\d+)(.*)$/))) return [m[1] / m[2], m[3]];
  if ((m = s.match(/^(\d+)?\s*([½⅓⅔¼¾⅛⅜⅝⅞])(.*)$/))) return [(+m[1] || 0) + FRAC[m[2]], m[3]];
  if ((m = s.match(/^(\d*[.,]?\d+)(.*)$/))) return [parseFloat(m[1].replace(',', '.')), m[2]];
  return null;
}
/** "3 tbsp" in the cups column -> {value:3, unit:'tbsp'}; "250" in grams -> {value:250, unit:'g'}; "2" in Amount -> count */
function parseQty(raw, col) {
  const s = String(raw).trim();
  const p = parseNumber(s);
  if (!p || !isFinite(p[0])) return { text: s, col };
  const rest = p[1].trim();
  const unit = rest ? normUnit(rest) : normUnit(col);
  return { value: p[0], unit, label: rest && !unit ? rest : '', col };
}

const GLYPHS = [[0, ''], [1/8, '⅛'], [1/4, '¼'], [1/3, '⅓'], [3/8, '⅜'], [1/2, '½'], [5/8, '⅝'], [2/3, '⅔'], [3/4, '¾'], [7/8, '⅞'], [1, '']];
const trimNum = (x, d) => String(+x.toFixed(d));
function frac(x) {
  if (!isFinite(x)) return '';
  let w = Math.floor(x); const f = x - w;
  let best = GLYPHS.reduce((a, b) => Math.abs(b[0] - f) < Math.abs(a[0] - f) ? b : a);
  if (Math.abs(best[0] - f) > 0.04) return trimNum(x, x < 10 ? 2 : 1);
  if (best[0] === 1) { w += 1; best = [0, '']; }
  if (w === 0 && !best[1]) return trimNum(x, 2);
  return (w ? String(w) : '') + best[1];
}
const metric = x => trimNum(x, x >= 100 ? 0 : x >= 10 ? 1 : 2);

/** Cups / tbsp / tsp: switch to the most readable of the three. */
function kitchen(v, unit) {
  const ml = v * UNITS[unit].f, inU = u => ml / UNITS[u].f;
  let u = unit;
  for (let i = 0; i < 4; i++) {
    if (u === 'cup' && inU('cup') < 0.25) u = 'tbsp';
    else if (u === 'tbsp' && inU('tbsp') < 1) u = 'tsp';
    else if (u === 'tbsp' && inU('tbsp') >= 8) u = 'cup';
    else if (u === 'tsp' && inU('tsp') >= 3) u = 'tbsp';
    else break;
  }
  return { v: inU(u), unit: u };
}
function unitLabel(u, v) { return u === 'cup' ? (v > 1 ? 'cups' : 'cup') : UNITS[u].label; }

/** Format one quantity at scale s, optionally converted to unit `target`. Returns {num, unit, val}. */
function fmt(q, s, target) {
  if (q.text != null) return { num: q.text, unit: '', val: null };
  let v = q.value * s, unit = q.unit;
  if (target && unit && target !== unit) { v = v * UNITS[unit].f / UNITS[target].f; unit = target; }
  if (unit && UNITS[unit]) {
    if (unit === 'cup' || unit === 'tbsp' || unit === 'tsp') {
      const k = kitchen(v, unit);
      return { num: frac(k.v), unit: unitLabel(k.unit, k.v), val: k.v };
    }
    return { num: metric(v), unit: unitLabel(unit, v), val: v };
  }
  return { num: frac(v), unit: q.label || '', val: v };
}

function quantities(ing) {
  return state.units.filter(u => String(ing.values[u] ?? '').trim()).map(u => parseQty(ing.values[u], u));
}
/** What to show for an ingredient in a given unit mode ('listed' = every unit, in the sheet's column order). */
function viewIng(ing, mode, s) {
  const qs = quantities(ing);
  if (!qs.length) return { primary: null, others: [], flag: '' };
  if (mode === 'listed') return { primary: fmt(qs[0], s), others: qs.slice(1).map(q => fmt(q, s)), flag: '' };
  const direct = qs.find(q => q.col === mode);
  if (direct) return { primary: fmt(direct, s), others: [], flag: '' };
  const tu = normUnit(mode);
  if (tu && UNITS[tu] && UNITS[tu].fam === 'vol') { // only volumes (ml / cups / tbsp / tsp) convert — never grams
    const src = qs.find(q => q.unit && UNITS[q.unit] && UNITS[q.unit].fam === UNITS[tu].fam);
    if (src) return { primary: fmt(src, s, tu), others: [], flag: 'approx' };
  }
  return { primary: fmt(qs[0], s), others: [], flag: 'fallback' };
}
function modesFor(r) {
  return state.units.filter(u => r.ingredients.some(i => { const v = viewIng(i, u, 1); return v.primary && v.flag !== 'fallback'; }));
}

/* =========================================================
   State & rendering
   ========================================================= */
const state = { units: [], recipes: [], view: 'home', current: null, mode: 'listed', scale: 1, query: '', draft: null, originalName: null, done: {}, busy: false };
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sortedRecipes = () => state.recipes.slice().sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
const findRecipe = name => state.recipes.find(r => r.name.toLowerCase() === String(name || '').toLowerCase());

function render() {
  if (state.view === 'recipe') renderRecipe();
  else if (state.view === 'edit') renderEditor();
  else renderHome();
}
function go(view) { state.view = view; render(); window.scrollTo(0, 0); }

/* ---------- home ---------- */
function renderHome() {
  app.innerHTML = `
  <div class="wrap">
    <div class="home-top">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" data-bind="q" value="${esc(state.query)}" placeholder="Search recipes or ingredients…" autocomplete="off">
      </div>
      <button class="btn icon-btn" data-action="refresh" title="Reload from Google Sheets" aria-label="Reload from Google Sheets">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      <button class="btn primary" data-action="new">+ Add recipe</button>
    </div>
    <div id="grid"></div>
  </div>`;
  renderGrid();
}
function renderGrid() {
  const q = state.query.trim().toLowerCase();
  const list = sortedRecipes().filter(r => !q || r.name.toLowerCase().includes(q) || r.ingredients.some(i => i.name.toLowerCase().includes(q)));
  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty">${state.recipes.length ? `No recipes match “${esc(state.query)}”.` : 'No recipes yet — add your first one.'}</div>`;
    return;
  }
  grid.innerHTML = `<div class="list">${list.map(r => `
    <button class="card" data-action="open" data-name="${esc(r.name)}">
      <h3>${esc(r.name)}</h3>
      <div class="meta">${r.ingredients.length} ingredient${r.ingredients.length === 1 ? '' : 's'}</div>
      <p class="peek">${esc(r.ingredients.map(i => i.name).join(', ') || '—')}</p>
    </button>`).join('')}</div>`;
}

/* ---------- recipe ---------- */
function openRecipe(name) {
  const r = findRecipe(name);
  if (!r) return go('home');
  state.current = r.name; state.scale = 1; state.done = {}; state.mode = 'listed';
  go('recipe');
}
function renderRecipe() {
  const r = findRecipe(state.current);
  if (!r) return go('home');
  const modes = modesFor(r);
  if (state.mode !== 'listed' && !modes.includes(state.mode)) state.mode = 'listed';
  const s = state.scale;
  const presets = [[0.5, '½'], [1, '1'], [2, '2'], [3, '3']];

  const ings = r.ingredients.map((ing, i) => {
    const v = viewIng(ing, state.mode, s);
    let qty = '';
    if (v.primary) {
      const p = v.primary;
      const num = p.val != null
        ? `<button class="amt" data-action="amt" data-i="${i}" data-val="${p.val}" title="Tap to scale the recipe to this amount">${esc(p.num)}</button>`
        : esc(p.num);
      const title = v.flag === 'fallback' ? ` title="Not available in ${esc(state.mode)}"` : v.flag === 'approx' ? ' title="Converted"' : '';
      qty = `<span class="qty ${v.flag === 'fallback' ? 'fallback' : ''}"${title}>${v.flag === 'approx' ? '≈ ' : ''}${num}${p.unit ? `<span class="u">${esc(p.unit)}</span>` : ''}</span>`;
    }
    const alt = v.others.length ? `<span class="alt">${v.others.map(o => esc(o.num + (o.unit ? ' ' + o.unit : ''))).join(' · ')}</span>` : '<span></span>';
    return `<li class="ing">${qty || '<span class="qty"></span>'}<span class="iname">${esc(ing.name)}</span>${alt}</li>`;
  }).join('');

  const steps = r.steps.map((st, i) => `<li class="${state.done[i] ? 'done' : ''}" data-action="step" data-i="${i}">${esc(st)}</li>`).join('');

  app.innerHTML = `
  <div class="bar">
    <div class="bar-in">
      <button class="btn ghost" data-action="home">← All recipes</button>
      <div class="spacer"></div>
      <button class="btn" data-action="edit">Edit</button>
    </div>
  </div>
  <div class="wrap">
    <h1 class="title">${esc(r.name)}</h1>
    <hr class="rule strong">
    <div class="opts recipe-opts">
      <div class="opt-group"><span class="opt-label">Units</span>
        <button class="opt ${state.mode === 'listed' ? 'on' : ''}" data-action="mode" data-mode="listed">as listed</button>
        ${modes.map(m => `<button class="opt ${state.mode === m ? 'on' : ''}" data-action="mode" data-mode="${esc(m)}">${esc(m.toLowerCase())}</button>`).join('')}
      </div>
      <div class="opt-group"><span class="opt-label">Scale</span>
        ${presets.map(([v, l]) => `<button class="opt ${Math.abs(s - v) < 1e-9 ? 'on' : ''}" data-action="scale" data-scale="${v}">${l}</button>`).join('')}
        <input class="scale-in" id="scaleIn" value="×${esc(trimNum(s, 2))}" aria-label="Custom scale" inputmode="decimal">
      </div>
    </div>
    ${Math.abs(s - 1) > 1e-9 ? `<div class="scaled-note">Scaled ×${esc(trimNum(s, 2))} · <button data-action="scale" data-scale="1">reset</button></div>` : ''}
    <h2 class="section">Ingredients</h2>
    ${ings ? `<ul class="ings">${ings}</ul>` : '<p class="none">No ingredients yet.</p>'}
    <hr class="rule">
    <h2 class="section">Instructions</h2>
    ${steps ? `<ol class="steps">${steps}</ol>` : '<p class="none">No instructions yet.</p>'}
    <hr class="rule">
    <div class="note-head"><h2 class="section">Notes</h2><span class="note-status" id="noteStatus"></span></div>
    <textarea class="note" id="note" data-bind="note">${esc(r.note || '')}</textarea>
  </div>`;
}

function editAmount(btn) {
  const base = parseFloat(btn.dataset.val);
  const input = document.createElement('input');
  input.className = 'amt-input';
  input.value = btn.textContent;
  input.inputMode = 'decimal';
  btn.replaceWith(input);
  input.focus(); input.select();
  let finished = false;
  const finish = (apply) => {
    if (finished) return; finished = true;
    const p = parseNumber(input.value);
    if (apply && p && isFinite(p[0]) && p[0] > 0 && base > 0) state.scale = state.scale * p[0] / base;
    render();
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
  input.addEventListener('blur', () => finish(true));
}

/* ---------- editor ---------- */
function openEditor(recipe) {
  state.draft = recipe
    ? JSON.parse(JSON.stringify(recipe))
    : { name: '', ingredients: [{ name: '', values: {} }, { name: '', values: {} }], steps: [''] };
  if (!state.draft.ingredients.length) state.draft.ingredients.push({ name: '', values: {} });
  if (!state.draft.steps.length) state.draft.steps.push('');
  state.originalName = recipe ? recipe.name : null;
  go('edit');
}
function placeholder(u) {
  const n = normUnit(u);
  if (!n) return 'e.g. 2';
  if (n === 'cup') return 'e.g. 1/2 cup';
  if (n === 'g') return 'e.g. 250';
  if (n === 'ml') return 'e.g. 125';
  return 'e.g. 1';
}
function renderEditor() {
  const d = state.draft, U = state.units;
  const cols = `28px minmax(140px,2fr) repeat(${U.length}, minmax(76px,1fr)) 96px`;
  const mv = (kind, i, len) => `
    <div class="rowact">
      <button class="mini" data-action="up" data-kind="${kind}" data-i="${i}" ${i === 0 ? 'disabled' : ''} title="Move up" aria-label="Move up">↑</button>
      <button class="mini" data-action="down" data-kind="${kind}" data-i="${i}" ${i === len - 1 ? 'disabled' : ''} title="Move down" aria-label="Move down">↓</button>
      <button class="mini x" data-action="remove" data-kind="${kind}" data-i="${i}" title="Remove" aria-label="Remove">✕</button>
    </div>`;
  app.innerHTML = `
  <div class="bar"><div class="bar-in">
    <button class="btn ghost" data-action="cancel">← Cancel</button>
    <div class="spacer"></div>
    ${state.originalName ? '<button class="btn danger" data-action="delete">Delete</button>' : ''}
    <button class="btn primary" data-action="save" ${state.busy ? 'disabled' : ''}>${state.busy ? 'Saving…' : 'Save to Sheets'}</button>
  </div></div>
  <div class="wrap">
    <h1 class="title left">${state.originalName ? 'Edit recipe' : 'New recipe'}</h1>
    <hr class="rule strong">
    <label class="field"><span>Recipe name</span>
      <input class="in big" data-bind="name" value="${esc(d.name)}" placeholder="e.g. Tiramisu"></label>

    <h2 class="section">Ingredients</h2>
    <p class="hint">Fill in whichever units you have. A plain number uses that column's unit; you can also type things like <b>3 tbsp</b> or <b>1/2 cup</b>.</p>
    <div class="ehead" style="grid-template-columns:${cols}"><span></span><span>Ingredient</span>${U.map(u => `<span>${esc(u)}</span>`).join('')}<span></span></div>
    ${d.ingredients.map((ing, i) => `
      <div class="erow" style="--cols:${cols}">
        <span class="num">${i + 1}</span>
        <input class="in" data-bind="ing" data-i="${i}" value="${esc(ing.name)}" placeholder="Ingredient">
        <div class="units">${U.map(u => `
          <label class="uf"><span>${esc(u)}</span>
            <input class="in" data-bind="unit" data-i="${i}" data-u="${esc(u)}" value="${esc(ing.values[u] || '')}" placeholder="${esc(placeholder(u))}"></label>`).join('')}
        </div>
        ${mv('ing', i, d.ingredients.length)}
      </div>`).join('')}
    <button class="btn add-row" data-action="add-ing">+ Add ingredient</button>

    <hr class="rule">
    <h2 class="section">Instructions</h2>
    ${d.steps.map((st, i) => `
      <div class="srow">
        <span class="num">${i + 1}</span>
        <textarea class="in" rows="1" data-bind="step" data-i="${i}" placeholder="Describe this step">${esc(st)}</textarea>
        ${mv('step', i, d.steps.length)}
      </div>`).join('')}
    <button class="btn add-row" data-action="add-step">+ Add step</button>
  </div>`;
}

async function save() {
  const d = state.draft;
  const recipe = {
    name: d.name.trim(),
    ingredients: d.ingredients.filter(i => i.name.trim()).map(i => {
      const values = {};
      state.units.forEach(u => { const v = String(i.values[u] || '').trim(); if (v) values[u] = v; });
      return { name: i.name.trim(), values };
    }),
    steps: d.steps.map(s => s.trim()).filter(Boolean)
  };
  if (!recipe.name) return toast('Give the recipe a name first.', true);
  if (!recipe.ingredients.length) return toast('Add at least one ingredient.', true);
  state.busy = true; render();
  try {
    const data = await call('saveRecipe', recipe, state.originalName);
    load(data);
    state.busy = false;
    toast('Saved to Google Sheets');
    openRecipe(recipe.name);
  } catch (e) {
    state.busy = false; render();
    toast(errMsg(e), true);
  }
}

/* =========================================================
   Events
   ========================================================= */
app.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action, i = +el.dataset.i;
  switch (a) {
    case 'open': return openRecipe(el.dataset.name);
    case 'home': return go('home');
    case 'new': return openEditor(null);
    case 'edit': return openEditor(findRecipe(state.current));
    case 'cancel': return state.originalName ? openRecipe(state.originalName) : go('home');
    case 'refresh': return refresh();
    case 'mode': state.mode = el.dataset.mode; return render();
    case 'scale': state.scale = +el.dataset.scale; return render();
    case 'amt': return editAmount(el);
    case 'step': state.done[i] = !state.done[i]; el.classList.toggle('done'); return;
    case 'add-ing': state.draft.ingredients.push({ name: '', values: {} }); render(); return focusLast('[data-bind="ing"]');
    case 'add-step': state.draft.steps.push(''); render(); return focusLast('[data-bind="step"]');
    case 'up': case 'down': case 'remove': {
      const arr = el.dataset.kind === 'ing' ? state.draft.ingredients : state.draft.steps;
      if (a === 'remove') { arr.splice(i, 1); if (!arr.length) arr.push(el.dataset.kind === 'ing' ? { name: '', values: {} } : ''); }
      else { const j = a === 'up' ? i - 1 : i + 1; if (j >= 0 && j < arr.length) [arr[i], arr[j]] = [arr[j], arr[i]]; }
      return render();
    }
    case 'save': return save();
    case 'delete': {
      const ok = await confirmBox(`Delete “${state.originalName}”?`, 'This removes its ingredients and steps from your Google Sheet.', 'Delete');
      if (!ok) return;
      try {
        load(await call('deleteRecipe', state.originalName));
        toast('Recipe deleted'); go('home');
      } catch (err) { toast(errMsg(err), true); }
      return;
    }
  }
});

app.addEventListener('input', e => {
  const t = e.target, b = t.dataset.bind;
  if (!b) return;
  const i = +t.dataset.i;
  if (b === 'q') { state.query = t.value; renderGrid(); }
  else if (b === 'name') state.draft.name = t.value;
  else if (b === 'ing') state.draft.ingredients[i].name = t.value;
  else if (b === 'unit') state.draft.ingredients[i].values[t.dataset.u] = t.value;
  else if (b === 'step') state.draft.steps[i] = t.value;
  else if (b === 'note') queueNote(state.current, t.value);
});

app.addEventListener('change', e => {
  if (e.target.id !== 'scaleIn') return;
  const p = parseNumber(e.target.value.replace(/^[×x*]\s*/i, ''));
  if (p && isFinite(p[0]) && p[0] > 0) state.scale = p[0];
  render();
});
app.addEventListener('focusin', e => { if (e.target.id === 'scaleIn') e.target.select(); });

/* Notes autosave: saves ~0.8s after you stop typing, one request at a time, latest text wins. */
const notes = { timer: null, inFlight: false, pending: null };
function setNoteStatus(text) { const el = document.getElementById('noteStatus'); if (el) el.textContent = text; }
function queueNote(name, text) {
  const r = findRecipe(name); if (r) r.note = text;
  notes.pending = { name, text };
  setNoteStatus('Editing…');
  clearTimeout(notes.timer);
  notes.timer = setTimeout(flushNote, 800);
}
async function flushNote() {
  clearTimeout(notes.timer); notes.timer = null;
  if (notes.inFlight || !notes.pending) return;
  const job = notes.pending; notes.pending = null; notes.inFlight = true;
  setNoteStatus('Saving…');
  try {
    await call('saveNote', job.name, job.text);
    if (!notes.pending) setNoteStatus('Saved');
  } catch (e) {
    if (!notes.pending) notes.pending = job;
    setNoteStatus('Not saved — retrying');
    notes.timer = setTimeout(flushNote, 3000);
  } finally {
    notes.inFlight = false;
    if (notes.pending && !notes.timer) flushNote();
  }
}
app.addEventListener('focusout', e => { if (e.target.id === 'note') flushNote(); });
window.addEventListener('beforeunload', e => { if (notes.pending || notes.inFlight) { flushNote(); e.preventDefault(); e.returnValue = ''; } });

function focusLast(sel) { const all = app.querySelectorAll(sel); if (all.length) all[all.length - 1].focus(); }

/* =========================================================
   Helpers
   ========================================================= */
let toastTimer;
function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast' + (err ? ' err' : ''), err ? 4500 : 2200);
}
const errMsg = e => (e && (e.message || e.toString())) || 'Something went wrong.';

function confirmBox(title, text, okLabel) {
  return new Promise(resolve => {
    const m = document.createElement('div');
    m.className = 'modal';
    m.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(text)}</p>
      <div class="modal-actions"><button class="btn" data-r="0">Cancel</button><button class="btn primary" data-r="1">${esc(okLabel)}</button></div></div>`;
    m.addEventListener('click', e => {
      const b = e.target.closest('[data-r]');
      if (b || e.target === m) { m.remove(); resolve(!!(b && b.dataset.r === '1')); }
    });
    document.body.appendChild(m);
  });
}

function load(data) {
  state.units = data.units || [];
  state.recipes = data.recipes || [];
}
async function refresh() {
  try {
    load(await call('getData'));
    render();
    toast('Up to date with Google Sheets');
  } catch (e) { toast(errMsg(e), true); }
}

async function start() {
  if (DEMO) document.getElementById('banner').innerHTML = '<div class="banner">Preview mode — showing sample data.</div>';
  app.innerHTML = '<div class="loading"><div><div class="spin"></div>Loading your recipes…</div></div>';
  try {
    load(await call('getData'));
    render();
  } catch (e) {
    app.innerHTML = `<div class="loading"><div><b>Couldn't load your recipes.</b><br>${esc(errMsg(e))}<br><br>
      <button class="btn" onclick="location.reload()">Try again</button></div></div>`;
  }
}
start();
</script>
</body>
